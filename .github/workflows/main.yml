name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-slim
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0

      - name: Publish Blazor project
        run: dotnet publish src/ScratchcardStatistics/ScratchcardStatistics.csproj --output release -warnaserror

      - name: Change base tag in index.html from '/' to '/ScratchcardStatistics/'
        run: sed -i 's/<base href="\/" \/>/<base href="\/ScratchcardStatistics\/" \/>/' release/wwwroot/index.html

      - name: Copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
